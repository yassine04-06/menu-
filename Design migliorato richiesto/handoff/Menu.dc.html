<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @keyframes heroIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{background:#f0f8fb;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
    :focus-visible{outline:2px solid #0daec8;outline-offset:2px;border-radius:4px}
    img{content-visibility:auto;will-change:auto}
    ::selection{background:#0daec8;color:#fff}
    #nav-inner{-webkit-overflow-scrolling:touch;scrollbar-width:none}
    #nav-inner::-webkit-scrollbar{display:none}
    button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .mcard{will-change:transform}
    .mcard:active{transform:scale(.98) translateZ(0);box-shadow:0 1px 6px rgba(6,24,37,.06) !important;transition:transform .1s ease,box-shadow .1s ease !important}
    .mgrid{display:grid;grid-template-columns:1fr;gap:.75rem}
    @media(min-width:600px){.mgrid{grid-template-columns:repeat(2,1fr);gap:.9rem}}
    @media(min-width:960px){
      .mgrid{grid-template-columns:repeat(3,1fr);gap:1.1rem}
      .mgrid[data-one]{grid-template-columns:minmax(0,400px);margin:0 auto}
      .mgrid[data-two]{grid-template-columns:repeat(2,1fr);max-width:780px;margin:0 auto}
    }
    @media(min-width:1200px){.mgrid{grid-template-columns:repeat(4,1fr)}}
    @media(min-width:960px){
      body{padding:2.5rem 0;background:linear-gradient(180deg,#c8e8f5 0%,#f0f8fb 22%)}
      .shell{max-width:1120px;border-radius:24px;overflow:hidden;box-shadow:0 24px 64px rgba(6,24,37,.15),0 0 0 1px rgba(6,24,37,.07);margin:0 auto}
    }
    @media(max-width:959px){
      .shell{box-shadow:none}
    }
    /* ── Small screens 375px ── */
    @media(max-width:390px){
      /* Hero più compatto */
      header{padding:3rem 1rem 2.8rem !important}
      header img{width:88px !important;height:88px !important;margin-bottom:.9rem !important}
      /* Titoli sezione */
      h2{font-size:1.45rem !important}
      /* Card padding ridotto */
      .mcard > div:last-child{padding:.75rem .85rem .85rem !important}
      /* Nav pill più piccole */
      #nav-inner button{font-size:.72rem !important;padding:.45rem .75rem !important}
      /* Main padding */
      #menu-main{padding:0 .6rem !important}
      /* Footer */
      footer .allergen-grid{grid-template-columns:1fr !important}
    }
    /* ── iPhone SE / schermi ultra-stretti 320-340px ── */
    @media(max-width:345px){
      #nav-bar{height:52px !important}
      #nav-inner{gap:.22rem !important}
      #nav-inner button{font-size:.66rem !important;padding:.4rem .58rem !important;min-height:36px !important;gap:.22rem !important}
      #nav-inner button span{font-size:.8rem !important}
      header{padding:2.6rem .8rem 2.4rem !important}
      header img{width:76px !important;height:76px !important}
      h1{font-size:1.55rem !important}
    }
    /* Assicura leggibilità testo card su qualunque telefono */
    @media(max-width:400px){
      .mcard h3{font-size:1rem !important}
      .mcard p{font-size:.76rem !important;line-height:1.5 !important}
    }
    @media(prefers-reduced-motion:reduce){
      *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
    }
  </style>
</helmet>

<div class="shell" style="min-height:100vh;min-height:100dvh;background:#f0f8fb;font-family:'DM Sans',system-ui,sans-serif;color:#082030;">

  <!-- HERO -->
  <header style="background:linear-gradient(160deg,#071e2e 0%,#0a2d44 38%,#0d3858 72%,#092840 100%);text-align:center;padding:4.5rem 2rem 3.8rem;position:relative;overflow:hidden;">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 28% 88%,rgba(13,174,200,.14) 0%,transparent 52%),radial-gradient(ellipse at 78% 14%,rgba(13,174,200,.08) 0%,transparent 48%);pointer-events:none;"></div>
    <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(45deg,transparent,transparent 60px,rgba(255,255,255,.006) 60px,rgba(255,255,255,.006) 61px);pointer-events:none;"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:90px;background:linear-gradient(to top,#f0f8fb,transparent);pointer-events:none;"></div>
    <div style="position:relative;z-index:2;">
      <img src="logo.png" alt="Qahwat Blu Caffé" loading="eager" style="width:118px;height:118px;object-fit:contain;border-radius:50%;display:block;margin:0 auto 1.3rem;filter:drop-shadow(0 4px 28px rgba(0,0,0,.55));animation:heroIn .95s cubic-bezier(.16,1,.3,1) .05s both;">
      <h1 style="font-family:'Playfair Display',Georgia,serif;color:#fff;font-size:clamp(1.8rem,7vw,3.1rem);font-weight:700;letter-spacing:.02em;margin-bottom:.5rem;animation:heroIn .95s cubic-bezier(.16,1,.3,1) both;text-shadow:0 3px 32px rgba(0,0,0,.45);">Qahwat <span style="color:#45d4ea;">Blu Caffé</span></h1>
      <p style="color:rgba(255,255,255,.88);font-size:clamp(.7rem,.82rem + .1vw,.82rem);font-weight:300;letter-spacing:.12em;text-transform:uppercase;animation:heroIn .95s cubic-bezier(.16,1,.3,1) .15s both;">Un angolo di Marocco nel cuore di Saronno</p>
      <p style="color:rgba(69,212,234,.9);font-size:clamp(.68rem,.76rem + .1vw,.76rem);font-family:'Playfair Display',serif;font-style:italic;margin-top:.65rem;animation:heroIn .95s cubic-bezier(.16,1,.3,1) .3s both;">Cucina autentica · Ingredienti freschi · Tradizione artigianale</p>
      <div style="display:flex;align-items:center;justify-content:center;gap:.85rem;margin-top:1.9rem;animation:heroIn .95s cubic-bezier(.16,1,.3,1) .42s both;">
        <div style="width:64px;height:1px;background:linear-gradient(90deg,transparent,rgba(69,212,234,.65));"></div>
        <div style="width:8px;height:8px;background:#0daec8;transform:rotate(45deg);box-shadow:0 0 12px rgba(13,174,200,.6);"></div>
        <div style="width:64px;height:1px;background:linear-gradient(90deg,rgba(69,212,234,.65),transparent);"></div>
      </div>
    </div>
  </header>

  {{ nav }}

  <main id="menu-main" style="max-width:1120px;margin:0 auto;padding:0 max(.75rem,env(safe-area-inset-left));padding-left:max(.75rem,env(safe-area-inset-left));padding-right:max(.75rem,env(safe-area-inset-right));">
    {{ main }}
  </main>

  <footer style="background:linear-gradient(160deg,#071e2e 0%,#0a2d44 45%,#092840 100%);position:relative;overflow:hidden;margin-top:2rem;">
    <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(13,174,200,.35),transparent);"></div>
    <div style="text-align:center;padding:2.5rem 1.5rem calc(2.2rem + env(safe-area-inset-bottom));position:relative;">
      <div style="font-family:'Playfair Display',serif;color:#45d4ea;font-size:1.3rem;font-weight:600;letter-spacing:.03em;margin-bottom:.4rem;">Qahwat Blu Caffé</div>
      <div style="width:36px;height:1px;background:rgba(13,174,200,.38);margin:.5rem auto;"></div>
      <p style="color:rgba(255,255,255,.78);font-family:'Playfair Display',serif;font-style:italic;font-size:.82rem;margin-bottom:.3rem;">Dove ogni piatto racconta una storia</p>
      <p style="color:rgba(255,255,255,.58);font-size:.68rem;letter-spacing:.04em;">Menu digitale · Tutti i prezzi sono IVA inclusa</p>
      {{ allergenLegend }}
    </div>
  </footer>

  {{ backToTop }}

</div>

/* ── Component ────────────────────────────────────────────── */
class Component extends DCLogic {
  state = { active: 'colazione', showTop: false, openA: {}, navAtStart: true, navAtEnd: false };

  get isTouch() { return window.matchMedia('(hover:none)').matches; }

  haptic(type = 'light') {
    if (!navigator.vibrate) return;
    const patterns = { light: 8, medium: 18, heavy: 32, success: [10, 50, 10] };
    navigator.vibrate(patterns[type] ?? 8);
  }

  componentDidMount() {
    // Scroll spy
    const secs = CATS.map(c => document.getElementById(c.id)).filter(Boolean);
    this._obs = new IntersectionObserver(entries => {
      const vis = entries.filter(e => e.isIntersecting);
      if (!vis.length) return;
      const top = vis.reduce((a, b) => a.boundingClientRect.top <= b.boundingClientRect.top ? a : b);
      const id = top.target.id;
      this.setState({ active: id });
      const ni = document.getElementById('nav-inner');
      const btn = document.getElementById('nb-' + id);
      if (ni && btn) {
        const nr = ni.getBoundingClientRect(), br = btn.getBoundingClientRect();
        ni.scrollTo({ left: ni.scrollLeft + br.left - nr.left - nr.width / 2 + br.width / 2, behavior: 'smooth' });
      }
    }, { rootMargin: '-10% 0px -75% 0px', threshold: 0 });
    secs.forEach(s => this._obs.observe(s));
    // Back to top — throttled for perf
    let ticking = false;
    this._onScroll = () => {
      if (!ticking) {
        requestAnimationFrame(() => {
          this.setState({ showTop: window.scrollY > 400 });
          ticking = false;
        });
        ticking = true;
      }
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }

  componentWillUnmount() {
    this._obs && this._obs.disconnect();
    this._navResizeObs && this._navResizeObs.disconnect();
    window.removeEventListener('scroll', this._onScroll);
  }

  goTo(id) {
    this.haptic('light');
    this.setState({ active: id }); // feedback immediato, non aspetta lo scroll-spy
    const el = document.getElementById(id);
    if (!el) return;
    const nb = document.getElementById('nav-bar');
    const nh = nb ? nb.offsetHeight : 58;
    window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - nh - 8, behavior: 'smooth' });
  }

  setupNavDrag(ni) {
    if (!ni || this._dragSetup) return;
    this._dragSetup = true;
    let isDown = false, startX = 0, startScroll = 0, moved = false;
    ni.style.cursor = 'grab';
    ni.addEventListener('mousedown', ev => {
      isDown = true; moved = false;
      startX = ev.pageX; startScroll = ni.scrollLeft;
      ni.style.cursor = 'grabbing';
    });
    window.addEventListener('mouseup', () => { isDown = false; ni.style.cursor = 'grab'; });
    window.addEventListener('mousemove', ev => {
      if (!isDown) return;
      const dx = ev.pageX - startX;
      if (Math.abs(dx) > 4) moved = true;
      ni.scrollLeft = startScroll - dx;
    });
    // Prevent click-through when it was actually a drag
    ni.addEventListener('click', ev => {
      if (moved) { ev.stopPropagation(); ev.preventDefault(); }
    }, true);
    // Traccia posizione scroll per mostrare/nascondere frecce e fade laterali.
    // Se non c'è overflow (nav intera su schermi larghi), atStart e atEnd sono
    // entrambi true → frecce e fade restano nascosti.
    const updateFade = () => {
      const overflows = ni.scrollWidth > ni.clientWidth + 2;
      const atStart = !overflows || ni.scrollLeft <= 2;
      const atEnd = !overflows || ni.scrollLeft >= ni.scrollWidth - ni.clientWidth - 2;
      this.setState(s => (s.navAtStart === atStart && s.navAtEnd === atEnd) ? null : { navAtStart: atStart, navAtEnd: atEnd });
    };
    ni.addEventListener('scroll', updateFade, { passive: true });
    updateFade();
    requestAnimationFrame(updateFade);
    // ResizeObserver copre anche i cambi di layout (font caricati, zoom, ecc.), non solo il resize finestra
    if (window.ResizeObserver) {
      this._navResizeObs = new ResizeObserver(updateFade);
      this._navResizeObs.observe(ni);
    }
    window.addEventListener('resize', updateFade);
  }

  toggleA(key) {
    this.haptic('light');
    this.setState(s => ({ openA: { ...s.openA, [key]: !s.openA[key] } }));
  }

  scrollNav(dir) {
    this.haptic('light');
    const ni = document.getElementById('nav-inner');
    if (ni) ni.scrollBy({ left: dir * 180, behavior: 'smooth' });
